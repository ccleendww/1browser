workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        IPA_NAME: "1browser-unsigned.ipa"
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS (release, no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          mkdir -p build/ios/ipa
          cd build/ios/unsigned
          zip -r ../ipa/1browser-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/1browser-unsigned.ipa
