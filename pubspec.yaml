name: audio_player
description: A Flutter audio player for iOS (iPhone & iPad) that plays audio files from a selected folder with sleep timer support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 音频播放
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  # 文件选择与访问
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  path: ^1.8.3
  # 状态管理
  provider: ^6.1.1
  # 工具
  intl: ^0.18.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
